[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remanence"
version = "0.1.0"
description = "Floppy disk acquisition (Dump) and catalogue consultation (Library) tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CeCILL-2.1" }
authors = [{ name = "Romain Negrel" }]
keywords = ["floppy", "preservation", "greaseweazle", "commodore", "archival"]

# Pinned runtime dependencies (frozen exact versions: see SOFTWARE-SPEC.md §2 and
# CLAUDE.md §3). Exact pins keep pip's resolver from backtracking across the whole
# version space of these heavy packages when combined with the greaseweazle VCS
# dependency (avoids ResolutionTooDeep).
dependencies = [
    "PySide6==6.8.3",
    "opencv-python==4.10.0.84",
    "Pillow==11.3.0",
    "numpy==2.2.6",
    "ruamel.yaml==0.18.17",
    "d64==1.10",
    "jsonschema==4.26.0",
    # greaseweazle is installed from a pinned Git revision (no PyPI release).
    "greaseweazle @ git+https://github.com/keirf/greaseweazle@v1.21",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-qt==4.5.0",
    "ruff==0.6.9",
]

[project.scripts]
remanence = "remanence.cli.main:main"

[tool.setuptools.packages.find]
include = ["remanence*"]

[tool.setuptools.package-data]
remanence = ["fixtures/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
